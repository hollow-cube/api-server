openapi: 3.0.3
info:
    title: Server API
    version: "1.0"
paths:
    /auth/grant:
        post:
            operationId: createLaunchGrant
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
            responses:
                "201":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /head-database/{category}:
        get:
            operationId: getHeadDatabaseCategory
            parameters:
                - name: category
                  in: path
                  required: true
                  schema:
                    type: string
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                - name: pageSize
                  in: query
                  required: true
                  schema:
                    type: integer
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /head-database/search:
        get:
            operationId: searchHeadDatabase
            parameters:
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                - name: pageSize
                  in: query
                  required: true
                  schema:
                    type: integer
                - name: query
                  in: query
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /interactions:
        post:
            operationId: executeInteraction
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /interactions/commands:
        get:
            operationId: getCommands
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /maps/{mapId}/files:
        get:
            operationId: listMapFiles
            parameters:
                - name: mapId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /maps/{mapId}/files/{path}:
        get:
            operationId: getMapFile
            parameters:
                - name: mapId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: path
                  in: path
                  required: true
                  description: 'Wildcard path segment: captures one or more path segments (no leading slash).'
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
    /maps/{mapId}/leaderboard:
        delete:
            operationId: deleteMapLeaderboard
            parameters:
                - name: mapId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: playerId
                  in: query
                  required: true
                  schema:
                    type: string
                - name: notify
                  in: query
                  required: true
                  schema:
                    type: boolean
            responses:
                "204":
                    description: Successful response
        get:
            operationId: getMapLeaderboard
            parameters:
                - name: mapId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: playerId
                  in: query
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
        put:
            operationId: restoreMapLeaderboard
            parameters:
                - name: mapId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
    /maps/{mapId}/states/{playerId}/{stateId}:
        put:
            operationId: upsertSaveState
            parameters:
                - name: mapId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: playerId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: stateId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
            responses:
                "200":
                    description: Successful response
    /maps/{mapId}/states/{playerId}/best:
        get:
            operationId: getBestSaveState
            parameters:
                - name: mapId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: playerId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /maps/{mapId}/states/{playerId}/latest:
        get:
            operationId: getLatestSaveState
            parameters:
                - name: mapId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: playerId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: type
                  in: query
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /maps/hub/leaderboard/{leaderboardId}:
        get:
            operationId: getGlobalLeaderboard
            parameters:
                - name: leaderboardId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: playerId
                  in: query
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /maps/search:
        get:
            operationId: searchMaps
            parameters:
                - name: building
                  in: query
                  required: false
                  schema:
                    type: boolean
                - name: contest
                  in: query
                  required: false
                  schema:
                    type: string
                - name: difficulty
                  in: query
                  required: false
                  schema:
                    type: string
                - name: owner
                  in: query
                  required: false
                  schema:
                    type: string
                - name: parkour
                  in: query
                  required: false
                  schema:
                    type: boolean
                - name: quality
                  in: query
                  required: false
                  schema:
                    type: string
                - name: query
                  in: query
                  required: false
                  schema:
                    type: string
                - name: sort
                  in: query
                  required: false
                  schema:
                    type: string
                - name: sortOrder
                  in: query
                  required: false
                  schema:
                    type: string
                - name: page
                  in: query
                  required: false
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /maps/search/progress:
        post:
            operationId: searchMapProgress
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /players:
        post:
            operationId: createPlayerData
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
            responses:
                "201":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /players/{playerId}/map-history:
        get:
            operationId: getPlayerMapHistory
            parameters:
                - name: playerId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                - name: pageSize
                  in: query
                  required: true
                  schema:
                    type: integer
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /players/{playerId}/top-times:
        get:
            operationId: getPlayerTopTimes
            parameters:
                - name: playerId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                - name: pageSize
                  in: query
                  required: true
                  schema:
                    type: integer
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
