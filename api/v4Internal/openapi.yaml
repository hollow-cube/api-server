openapi: 3.0.3
info:
    title: Server API
    version: "1.0"
paths:
    /auth/grant:
        post:
            operationId: createLaunchGrant
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
            responses:
                "201":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /head-database/{category}:
        get:
            operationId: getHeadDatabaseCategory
            parameters:
                - name: category
                  in: path
                  required: true
                  schema:
                    type: string
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                - name: pageSize
                  in: query
                  required: true
                  schema:
                    type: integer
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /head-database/search:
        get:
            operationId: searchHeadDatabase
            parameters:
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                - name: pageSize
                  in: query
                  required: true
                  schema:
                    type: integer
                - name: query
                  in: query
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /interactions:
        post:
            operationId: executeInteraction
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /interactions/commands:
        get:
            operationId: getCommands
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /maps/{mapId}/files:
        get:
            operationId: listMapFiles
            parameters:
                - name: mapId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /maps/{mapId}/files/{path}:
        get:
            operationId: getMapFile
            parameters:
                - name: mapId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: path
                  in: path
                  required: true
                  description: 'Wildcard path segment: captures one or more path segments (no leading slash).'
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
    /maps/{mapId}/leaderboard:
        delete:
            operationId: deleteMapLeaderboard
            parameters:
                - name: mapId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: playerId
                  in: query
                  required: true
                  schema:
                    type: string
                - name: notify
                  in: query
                  required: true
                  schema:
                    type: boolean
            responses:
                "204":
                    description: Successful response
        get:
            operationId: getMapLeaderboard
            parameters:
                - name: mapId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: playerId
                  in: query
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
        put:
            operationId: restoreMapLeaderboard
            parameters:
                - name: mapId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
    /maps/{mapId}/states/{playerId}/{stateId}:
        put:
            operationId: upsertSaveState
            parameters:
                - name: mapId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: playerId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: stateId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
            responses:
                "200":
                    description: Successful response
    /maps/{mapId}/states/{playerId}/best:
        get:
            operationId: getBestSaveState
            parameters:
                - name: mapId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: playerId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /maps/{mapId}/states/{playerId}/latest:
        get:
            operationId: getLatestSaveState
            parameters:
                - name: mapId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: playerId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: type
                  in: query
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /maps/hub/leaderboard/{leaderboardId}:
        get:
            operationId: getGlobalLeaderboard
            parameters:
                - name: leaderboardId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: playerId
                  in: query
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /maps/search:
        get:
            operationId: searchMaps
            parameters:
                - name: building
                  in: query
                  required: false
                  schema:
                    type: boolean
                - name: contest
                  in: query
                  required: false
                  schema:
                    type: string
                - name: difficulty
                  in: query
                  required: false
                  schema:
                    type: string
                - name: owner
                  in: query
                  required: false
                  schema:
                    type: string
                - name: parkour
                  in: query
                  required: false
                  schema:
                    type: boolean
                - name: quality
                  in: query
                  required: false
                  schema:
                    type: string
                - name: query
                  in: query
                  required: false
                  schema:
                    type: string
                - name: sort
                  in: query
                  required: false
                  schema:
                    type: string
                - name: sortOrder
                  in: query
                  required: false
                  schema:
                    type: string
                - name: page
                  in: query
                  required: false
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /maps/search/progress:
        post:
            operationId: searchMapProgress
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /notifications:
        get:
            operationId: getNotifications
            parameters:
                - name: playerId
                  in: query
                  required: true
                  schema:
                    type: string
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                - name: pageSize
                  in: query
                  required: true
                  schema:
                    type: integer
                - name: unreadOnly
                  in: query
                  required: true
                  schema:
                    type: boolean
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /notifications/{notificationId}:
        delete:
            operationId: deleteNotification
            parameters:
                - name: notificationId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: Successful response
        patch:
            operationId: updateNotification
            parameters:
                - name: notificationId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
            responses:
                "200":
                    description: Successful response
    /players:
        post:
            operationId: createPlayerData
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
            responses:
                "201":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /players/{playerId}:
        get:
            operationId: getPlayerData
            parameters:
                - name: playerId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
        patch:
            operationId: updatePlayerData
            parameters:
                - name: playerId
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
            responses:
                "200":
                    description: Successful response
    /players/{playerId}/alts:
        get:
            operationId: getPlayerAlts
            parameters:
                - name: playerId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /players/{playerId}/display-name:
        get:
            operationId: getPlayerDisplayName
            parameters:
                - name: playerId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /players/{playerId}/hypercube:
        get:
            operationId: getPlayerHypercube
            parameters:
                - name: playerId
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /players/{playerId}/map-history:
        get:
            operationId: getPlayerMapHistory
            parameters:
                - name: playerId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                - name: pageSize
                  in: query
                  required: true
                  schema:
                    type: integer
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /players/{playerId}/top-times:
        get:
            operationId: getPlayerTopTimes
            parameters:
                - name: playerId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                - name: pageSize
                  in: query
                  required: true
                  schema:
                    type: integer
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /players/search:
        post:
            operationId: searchPlayers
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
            responses:
                "200":
                    description: Successful response
                    content:
                        application/json:
                            schema:
                                type: object
    /replays/{id}:
        get:
            operationId: getReplay
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/vnd.hollowcube.replay-preamble:
                            schema:
                                type: string
                                format: binary
    /replays/{id}/stream:
        get:
            operationId: getReplayStream
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: segment
                  in: query
                  required: false
                  schema:
                    type: string
                - name: Range
                  in: header
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: Successful response
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
                        application/vnd.hollowcube.replay:
                            schema:
                                type: string
                                format: binary
                "206":
                    description: Successful response
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
                        application/vnd.hollowcube.replay:
                            schema:
                                type: string
                                format: binary
        patch:
            operationId: commitReplay
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: If-Match
                  in: header
                  required: false
                  schema:
                    type: string
                - name: If-None-Match
                  in: header
                  required: false
                  schema:
                    type: string
                - name: Idempotency-Key
                  in: header
                  required: true
                  schema:
                    type: string
                - name: Replay-Preamble-Length
                  in: header
                  required: true
                  schema:
                    type: string
                - name: Replay-Segment-Index
                  in: header
                  required: false
                  schema:
                    type: string
                - name: Replay-Final
                  in: header
                  required: false
                  schema:
                    type: string
                - name: Content-Digest
                  in: header
                  required: true
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/vnd.hollowcube.replay-commit:
                        schema:
                            type: string
                            format: binary
            responses:
                "200":
                    description: Successful response
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
                "201":
                    description: Successful response
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
        put:
            operationId: publishCompactedReplay
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: If-Match
                  in: header
                  required: true
                  schema:
                    type: string
                - name: Idempotency-Key
                  in: header
                  required: true
                  schema:
                    type: string
                - name: Replay-Preamble-Length
                  in: header
                  required: true
                  schema:
                    type: string
                - name: Content-Digest
                  in: header
                  required: true
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/vnd.hollowcube.replay:
                        schema:
                            type: string
                            format: binary
            responses:
                "200":
                    description: Successful response
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
